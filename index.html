<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1efe8">
  <meta name="description" content="Alvin & Janice — two wedding card designs, presented at 18 × 5.4 cm proportions for merchant review.">
  <meta name="robots" content="noindex, nofollow">
  <title>Alvin & Janice — Card Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main aria-label="Alvin and Janice wedding card preview">
    <div class="dimension" aria-label="Both card designs are 18 centimetres wide"><span>18 cm</span></div>

    <section class="design" aria-labelledby="moments-title">
      <div class="design-heading">
        <h1 id="moments-title"><span class="number">02</span> The four moments</h1>
        <p>4 photos · Classic collage</p>
      </div>
      <div class="card collage" role="img" aria-label="Four wedding portraits beneath cherry blossoms, with Alvin and Janice’s names in the centre">
        <img class="moment one" src="assets/moment-1.jpg" alt="" width="1200" height="800">
        <img class="moment two" src="assets/moment-2.jpg" alt="" width="800" height="1200">
        <div class="names"><span>Alvin</span><i>&amp;</i><span>Janice</span></div>
        <img class="moment three" src="assets/moment-3.jpg" alt="" width="1200" height="800">
        <img class="moment four" src="assets/moment-4.jpg" alt="" width="800" height="1200">
      </div>
    </section>

    <section class="design" aria-labelledby="signature-title">
      <div class="design-heading">
        <h2 id="signature-title"><span class="number">03</span> The signature</h2>
        <p>1 photo · Script names</p>
      </div>
      <div class="card signature" role="img" aria-label="Alvin and Janice on a grand staircase, with Alvin in script on the left and Janice on the right">
        <img class="signature-photo" src="assets/signature.jpg" alt="" width="1200" height="800">
        <img class="script-name alvin" src="assets/alvin.svg" alt="" width="300" height="120">
        <img class="script-name janice" src="assets/janice.svg" alt="" width="300" height="120">
      </div>
    </section>
    <footer><span>Alvin &amp; Janice</span><span>Card size · 18 × 5.4 cm</span></footer>
  </main>
</body>
</html>
